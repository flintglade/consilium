name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example. Do not include credentials or private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and operating system
    validations:
      required: true
